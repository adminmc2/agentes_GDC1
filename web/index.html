function toggleEditCfg(editing) {
    const fields = document.querySelectorAll('.agent-cfg');
    const btnEdit = document.getElementById('btn-edit-cfg');
    const btnSave = document.getElementById('btn-save-cfg');
    fields.forEach(el => {
        el.disabled = !editing;
        el.style.opacity = editing ? '1' : '.7';
    });
    btnEdit.style.display = editing ? 'none' : '';
    btnSave.style.display = editing ? '' : 'none';
}

async function runAgent() {
    const btn = document.getElementById('btn-run');
    const agents = {};
    const ag = AGENTES[currentAgente];
    ag.tasks.forEach((t, i) => {
        agents[i] = {
            model: document.getElementById('sel-modelo-'+i)?.value || '',
            temperature: parseFloat((document.getElementById('sl-temp-'+i)?.value || 70) / 100),
            max_tokens: parseInt(document.getElementById('in-maxtok-'+i)?.value || 8192),
            top_p: parseFloat((document.getElementById('sl-topp-'+i)?.value || 100) / 100),
        };
    });
    btn.textContent = 'Ejecutando...'; btn.disabled = true; btn.className = 'btn btn-secondary';
    try {
        const res = await fetch('/api/agente/run', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({agente: currentAgente, unidad: currentUnidad, agents: agents})});
        const data = await res.json();
        if (data.error) { alert(data.error); btn.textContent='Ejecutar'; btn.disabled=false; btn.className='btn btn-success'; return; }
        currentRunId = data.run_id;
        goToEjecucion(data.run_id);
    } catch(e) { alert('Error: '+e.message); btn.textContent='Ejecutar'; btn.disabled=false; btn.className='btn btn-success'; }
}

// ===== EJECUCION DETALLE =====
async function renderEjecucion(runId) {
    const ag = AGENTES[currentAgente];
    // Load all data
    let output = '', status = 'completed', elapsed = 0, modelo = '';
    try { const r = await fetch('/api/agente/output?run_id='+runId); const d = await r.json(); output = d.output || ''; } catch(e) {}
    try { const r = await fetch('/api/agente/status?run_id='+runId); const d = await r.json(); status=d.status||'completed'; elapsed=d.elapsed_s||0; modelo=d.modelo||''; } catch(e) {}
    try { const r = await fetch('/api/tarjetas?unidad='+currentUnidad); tarjetas = await r.json(); filteredTarjetas=[...tarjetas]; } catch(e) { tarjetas=[]; filteredTarjetas=[]; }
    try { const r = await fetch('/api/correcciones?unidad='+currentUnidad); correcciones = await r.json(); } catch(e) { correcciones=[]; }
    try { const r = await fetch('/api/evaluaciones?unidad='+currentUnidad); evaluaciones = await r.json(); } catch(e) { evaluaciones=[]; }
    const evalMatch = evaluaciones.find(e => e.run_id === runId) || evaluaciones[0];
    const sc = evalMatch ? (evalMatch.metricas||{}).score_global || 0 : 0;
    const modelShort = (modelo || (evalMatch||{}).modelo || '').split('/').pop();
    const badgeCls = status==='running'?'running':status==='completed'?(sc>=80?'good':'mid'):'bad';

    document.getElementById('ejec-header').innerHTML = `
        <span class="page-title">${ag.name} \u2014 U${currentUnidad}</span>
        <div class="page-subtitle">${modelShort} &middot; ${elapsed?elapsed+'s':''} &middot; <span style="color:var(--${badgeCls==='good'?'md-success':badgeCls==='mid'?'md-warning':'md-error'})">${status==='running'?'Ejecutando...':sc+'/100'}</span></div>`;

    let html = '';
    // Console
    html += `<div class="section" id="sec-consola"><div class="section-header" onclick="toggleSection('sec-consola')"><h2>Consola</h2><div><span class="sec-badge" id="console-status">${status==='running'?'Ejecutando...':status}</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body"><div class="console" id="console-output">${output||'Sin salida disponible.'}</div></div></div>`;
    // Evaluation
    html += `<div class="section" id="sec-evaluacion"><div class="section-header" onclick="toggleSection('sec-evaluacion')"><h2>Evaluación</h2><div><span class="sec-badge" id="eval-badge">${sc?sc+'/100':'--'}</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body"><div id="eval-content"></div></div></div>`;
    // Review progress
    const reviewed = tarjetas.filter(t => t.estado_revision === 'revisada').length;
    const totalCards = tarjetas.length;
    const pct = totalCards ? Math.round(reviewed / totalCards * 100) : 0;
    html += `<div class="section" id="sec-revision"><div class="section-header" onclick="toggleSection('sec-revision')"><h2>Revisión</h2><div><span class="sec-badge">${reviewed}/${totalCards}</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body">
        <div class="review-progress"><div class="review-bar"><div class="fill" style="width:${pct}%"></div></div><span class="review-text">${pct}% revisado</span></div>
        <div style="display:flex;gap:12px;font-size:13px;color:var(--md-on-surface-variant)"><span style="color:var(--md-warning);font-weight:600">${totalCards-reviewed} sin revisar</span><span style="color:var(--md-success);font-weight:600">${reviewed} revisadas</span></div>
        <div id="patterns-panel" style="margin-top:16px"></div>
        </div></div>`;
    // Tarjetas
    html += `<div class="section collapsed" id="sec-tarjetas"><div class="section-header" onclick="toggleSection('sec-tarjetas')"><h2>Tarjetas</h2><div><span class="sec-badge">${tarjetas.length}</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:12px;color:var(--md-on-surface-variant)" id="tarjetas-info">${tarjetas.length} tarjetas</span><input type="text" class="tarjetas-search" placeholder="Buscar..." id="tarjetas-search" oninput="filterTarjetas()"></div>
        <div class="tarjetas-table-wrap"><table class="tarjetas-table"><thead><tr>
            <th onclick="sortTarjetas('palabra')">Palabra</th><th onclick="sortTarjetas('nivel_jerarquia')">Nivel</th><th>Rev</th><th onclick="sortTarjetas('genero')">Gen</th><th>Sílaba</th><th onclick="sortTarjetas('campo_semantico')">Campo</th><th>Regla</th><th>IT</th><th>FR</th><th>PT</th><th>EN</th><th>CS</th><th>PL</th><th>TR</th><th>Combos</th><th>Acc</th>
        </tr></thead><tbody id="tarjetas-tbody"></tbody></table></div></div></div>`;
    // Reglas aprendidas
    html += `<div class="section collapsed" id="sec-reglas"><div class="section-header" onclick="toggleSection('sec-reglas')"><h2>Reglas aprendidas</h2><div><span class="sec-badge" id="reglas-count">0</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body"><div style="margin-bottom:12px"><button class="btn btn-secondary btn-sm" onclick="openReglaModal()">+ Nueva regla</button></div><div id="reglas-list"></div></div></div>`;
    // Trazas
    html += `<div class="section collapsed" id="sec-trazas"><div class="section-header" onclick="toggleSection('sec-trazas')"><h2>Trazas LLM</h2><div><span class="sec-badge" id="trazas-count">0</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body"><div id="trazas-list"></div></div></div>`;

    document.getElementById('ejec-sections').innerHTML = html;
    renderTarjetas();
    if (evalMatch) renderEvalContent(evalMatch);
    loadTrazas();
    loadPatterns();
    loadReglas();
    if (status === 'running') currentRunId = runId;
}

function renderEvalContent(ev) {
    const m = ev.metricas || {};
    const sc = m.score_global || 0;
    const scores = m.scores || {};
    const metrics = [['Sin plurales',scores.sin_plurales||0],['Sílabas',scores.silabas_correctas||0],['Combos',scores.combos_correctos||0],['Traducciones',scores.traducciones_completas||0],['Reglas',scores.reglas_correctas||0]];
    const el = document.getElementById('eval-content');
    el.innerHTML = `
        <div class="score-row">
            <div class="score-big ${sc>=80?'good':sc>=60?'mid':'bad'}">${sc}</div>
            <div class="metric-bars">${metrics.map(([l,v])=>{const c=v>=80?'var(--md-success)':v>=60?'var(--md-warning)':'var(--md-error)';return `<div class="metric-bar"><span class="label">${l}</span><div class="bar"><div class="fill" style="width:${v}%;background:${c}"></div></div><span class="val">${v}%</span></div>`;}).join('')}</div>
        </div>
        <div class="chart-row"><div class="chart-box"><h4>Métricas</h4><canvas id="chart-radar"></canvas></div><div class="chart-box"><h4>Historial</h4><canvas id="chart-history"></canvas></div></div>
        <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
            <button class="btn btn-secondary btn-sm" onclick="runEval()" id="btn-eval">Evaluar ahora</button>
            <span style="font-size:12px;color:var(--md-on-surface-variant)">${m.total||0} tarjetas | ${(ev.modelo||'').split('/').pop()}</span>
        </div>
        <div style="margin-top:12px"><h3 style="font-size:12px;color:var(--md-primary);margin-bottom:6px">Errores (${(m.errores||[]).length})</h3>
        ${(m.errores||[]).length ? (m.errores||[]).map(e=>`<div class="error-item"><span class="badge badge-${e.tipo==='plural'?'plural':e.tipo==='silaba'?'silaba':e.tipo==='traduccion'?'traduccion':e.tipo==='combo'?'combo':'otro'}">${e.tipo}</span><span style="color:var(--md-primary);min-width:80px">${e.palabra}</span><span style="color:var(--md-on-surface-variant)">${e.detalle}</span></div>`).join('') : '<div style="color:var(--md-success);font-size:12px">Sin errores</div>'}</div>`;
    // Charts
    if (chartRadar) chartRadar.destroy();
    chartRadar = new Chart(document.getElementById('chart-radar'), {type:'radar', data:{labels:metrics.map(m=>m[0]),datasets:[{label:(ev.modelo||'').split('/').pop(),data:metrics.map(m=>m[1]),backgroundColor:'rgba(181,168,76,.18)',borderColor:'var(--md-primary)',pointBackgroundColor:'var(--md-primary)'}]},options:{scales:{r:{min:0,max:100,ticks:{stepSize:20,color:'#999'},grid:{color:'#ddd'},pointLabels:{color:'#666',font:{size:10}}}},plugins:{legend:{labels:{color:'#666'}}}}});
    if (chartHist) chartHist.destroy();
    const rev=[...evaluaciones].reverse();
    chartHist = new Chart(document.getElementById('chart-history'), {type:'line', data:{labels:rev.map(e=>{const d=new Date(e.fecha);return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit'});}),datasets:[{label:'Score',data:rev.map(e=>(e.metricas||{}).score_global||0),borderColor:'var(--md-success)',backgroundColor:'rgba(92,184,122,.1)',fill:true,tension:.3}]},options:{scales:{y:{min:0,max:100,ticks:{color:'#999'},grid:{color:'#eee'}},x:{ticks:{color:'#999'},grid:{color:'#eee'}}},plugins:{legend:{labels:{color:'#666'}}}}});
}

async function runEval() {
    const btn = document.getElementById('btn-eval'); btn.textContent='Evaluando...'; btn.disabled=true;
    await fetch('/api/evaluaciones/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidad:currentUnidad})});
    const r = await fetch('/api/evaluaciones?unidad='+currentUnidad); evaluaciones = await r.json();
    if (evaluaciones.length) renderEvalContent(evaluaciones[0]);
    btn.textContent='Evaluar ahora'; btn.disabled=false;
}

// ===== POLL =====
async function pollRunStatus() {
    if (!currentRunId) return;
    try {
        const r = await fetch('/api/agente/status?run_id='+currentRunId); const d = await r.json();
        const or = await fetch('/api/agente/output?run_id='+currentRunId); const od = await or.json();
        const consoleEl = document.getElementById('console-output');
        const statusEl = document.getElementById('console-status');
        if (consoleEl && od.output) { consoleEl.textContent = od.output; consoleEl.scrollTop = consoleEl.scrollHeight; }
        if (d.status === 'running') {
            if (statusEl) statusEl.textContent = 'Ejecutando... '+d.elapsed_s+'s';
        } else {
            if (statusEl) statusEl.textContent = d.status+' ('+d.elapsed_s+'s)';
            if (d.status === 'completed' && consoleEl) {
                consoleEl.textContent += '\n--- Evaluando automáticamente... ---\n';
                await fetch('/api/evaluaciones/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidad:currentUnidad})});
            }
            currentRunId = null;
            if (currentView === 'ejecucion') {
                const r2 = await fetch('/api/evaluaciones?unidad='+currentUnidad); evaluaciones = await r2.json();
                const r3 = await fetch('/api/tarjetas?unidad='+currentUnidad); tarjetas = await r3.json(); filteredTarjetas=[...tarjetas];
                if (evaluaciones.length) renderEvalContent(evaluaciones[0]);
                renderTarjetas();
                const ti = document.getElementById('sec-tarjetas');
                if (ti) { ti.querySelector('.sec-badge').textContent = tarjetas.length; }
            }
        }
    } catch(e) {}
}

// ===== TARJETAS =====
function sortTarjetas(col) { if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;} filteredTarjetas.sort((a,b)=>{const va=a[col]!=null?a[col]:'';const vb=b[col]!=null?b[col]:'';if(typeof va==='number'&&typeof vb==='number')return sortDir*(va-vb);return sortDir*String(va).localeCompare(String(vb),'es');}); renderTarjetas(); }
function filterTarjetas() { const q=document.getElementById('tarjetas-search').value.toLowerCase(); filteredTarjetas=q?tarjetas.filter(t=>(t.palabra||'').toLowerCase().includes(q)):[...tarjetas]; const info=document.getElementById('tarjetas-info'); if(info) info.textContent=filteredTarjetas.length+(q?' de '+tarjetas.length:'')+' tarjetas'; renderTarjetas(); }
function renderTarjetas() {
    const tb = document.getElementById('tarjetas-tbody'); if (!tb) return;
    if (!filteredTarjetas.length) { tb.innerHTML='<tr><td colspan="15" class="empty">Sin tarjetas.</td></tr>'; return; }
    tb.innerHTML = filteredTarjetas.map(t => {
        const esc=s=>String(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
        const combos=(t.combos||[]).join(' | ');
        const hasCorr=f=>correcciones.some(c=>c.palabra===t.palabra&&c.campo===f);
        const cc=(campo,val)=>`onclick="openModal(${t.id},'${esc(t.palabra)}','${campo}','${esc(val)}')"`;
        const rev = t.estado_revision || 'sin_revisar';
        const revLabel = rev === 'revisada' ? 'Revisada' : 'Sin revisar';
        return `<tr><td><strong>${t.palabra||''}</strong></td><td><span style="font-size:10px;background:var(--md-surface-variant);padding:1px 5px;border-radius:3px">N${t.nivel_jerarquia||1}</span></td>
        <td><span class="rev-badge ${rev}">${revLabel}</span></td>
        <td class="clickable${hasCorr('genero')?' err':''}" ${cc('genero',t.genero)}>${t.genero||''}</td>
        <td class="clickable${hasCorr('silaba_tonica')?' err':''}" ${cc('silaba_tonica',t.silaba_tonica)}>${t.silaba_tonica||''}</td>
        <td class="clickable" ${cc('campo_semantico',t.campo_semantico)}>${t.campo_semantico||''}</td>
        <td class="clickable" ${cc('regla',t.regla)} title="${esc(t.regla)}">${t.regla||''}</td>
        <td class="clickable${hasCorr('trad_it')?' err':''}" ${cc('trad_it',t.trad_it)}>${t.trad_it||''}</td>
        <td class="clickable${hasCorr('trad_fr')?' err':''}" ${cc('trad_fr',t.trad_fr)}>${t.trad_fr||''}</td>
        <td class="clickable${hasCorr('trad_pt_br')?' err':''}" ${cc('trad_pt_br',t.trad_pt_br)}>${t.trad_pt_br||''}</td>
        <td class="clickable${hasCorr('trad_en')?' err':''}" ${cc('trad_en',t.trad_en)}>${t.trad_en||''}</td>
        <td class="clickable${hasCorr('trad_cs')?' err':''}" ${cc('trad_cs',t.trad_cs)}>${t.trad_cs||''}</td>
        <td class="clickable${hasCorr('trad_pl')?' err':''}" ${cc('trad_pl',t.trad_pl)}>${t.trad_pl||''}</td>
        <td class="clickable${hasCorr('trad_tr')?' err':''}" ${cc('trad_tr',t.trad_tr)}>${t.trad_tr||''}</td>
        <td title="${esc(combos)}" style="max-width:90px">${combos}</td>
        <td style="white-space:nowrap">${rev!=='revisada'?`<button style="padding:2px 6px;font-size:10px;border:none;border-radius:3px;cursor:pointer;background:#E8F5E9;color:#1B5E20" onclick="markReviewed(${t.id})" title="Marcar como revisada">&#10003;</button> `:''}<button style="padding:2px 6px;font-size:10px;border:none;border-radius:3px;cursor:pointer;background:var(--md-surface-variant)" onclick="openModal(${t.id},'${esc(t.palabra)}','','')" title="Corregir tarjeta">Corregir</button> <button style="padding:2px 6px;font-size:10px;border:none;border-radius:3px;cursor:pointer;background:#f8d7da;color:var(--md-error)" onclick="delCard(${t.id},'${esc(t.palabra)}')" title="Eliminar tarjeta">Eliminar</button></td></tr>`;
    }).join('');
}

// ===== CORRECTIONS =====
function openModal(id,palabra,campo,original) { document.getElementById('m-id').value=id; document.getElementById('m-palabra').value=palabra; document.getElementById('m-campo').value=campo; document.getElementById('m-campo-show').value=campo||'(selecciona)'; document.getElementById('m-original').value=original; document.getElementById('m-corregido').value=''; document.getElementById('modal-title').textContent='Corregir: '+palabra+(campo?' > '+campo:''); document.getElementById('m-crear-regla').checked=false; document.getElementById('m-regla-fields').style.display='none'; document.getElementById('m-regla-text').value=''; document.getElementById('m-regla-ejemplos').value=''; document.getElementById('modal-corr').classList.add('open'); }
function closeModal() { document.getElementById('modal-corr').classList.remove('open'); }
document.addEventListener('DOMContentLoaded', () => { const cb=document.getElementById('m-crear-regla'); if(cb) cb.addEventListener('change', ()=>{ document.getElementById('m-regla-fields').style.display=cb.checked?'block':'none'; }); });
async function submitFix() { const id=document.getElementById('m-id').value,palabra=document.getElementById('m-palabra').value,campo=document.getElementById('m-campo').value,original=document.getElementById('m-original').value,corregido=document.getElementById('m-corregido').value,tipo=document.getElementById('m-tipo').value; if(!corregido&&tipo!=='plural_no_deseado'){alert('Escribe el valor corregido');return;} await fetch('/api/correcciones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidad:currentUnidad,palabra,campo,valor_original:original,valor_corregido:corregido,tipo_error:tipo})}); if(corregido&&campo){await fetch('/api/tarjetas/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:+id,campo,valor:corregido})});} if(document.getElementById('m-crear-regla').checked){const reglaText=document.getElementById('m-regla-text').value.trim();if(reglaText){await fetch('/api/reglas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crew:'recurvo',tipo_error:tipo,regla:reglaText,ejemplos:document.getElementById('m-regla-ejemplos').value.trim(),n_correcciones:1,activa:true})});}} closeModal(); try{const r=await fetch('/api/tarjetas?unidad='+currentUnidad);tarjetas=await r.json();filteredTarjetas=[...tarjetas];renderTarjetas();loadPatterns();loadReglas();}catch(e){} }
async function delCard(id,palabra) { if(!confirm('Eliminar "'+palabra+'"?'))return; await fetch('/api/correcciones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidad:currentUnidad,palabra,campo:'palabra',valor_original:palabra,valor_corregido:null,tipo_error:'eliminada'})}); await fetch('/api/tarjetas/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); try{const r=await fetch('/api/tarjetas?unidad='+currentUnidad);tarjetas=await r.json();filteredTarjetas=[...tarjetas];renderTarjetas();}catch(e){} }

// ===== MARK AS REVIEWED =====
async function markReviewed(id) { await fetch('/api/tarjetas/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,campo:'estado_revision',valor:'revisada'})}); const t=tarjetas.find(t=>t.id===id); if(t) t.estado_revision='revisada'; const ft=filteredTarjetas.find(t=>t.id===id); if(ft) ft.estado_revision='revisada'; renderTarjetas(); updateReviewProgress(); }
function updateReviewProgress() { const reviewed=tarjetas.filter(t=>t.estado_revision==='revisada').length; const total=tarjetas.length; const pct=total?Math.round(reviewed/total*100):0; const sec=document.getElementById('sec-revision'); if(!sec) return; sec.querySelector('.sec-badge').textContent=reviewed+'/'+total; const bar=sec.querySelector('.review-bar .fill'); if(bar) bar.style.width=pct+'%'; const txt=sec.querySelector('.review-text'); if(txt) txt.textContent=pct+'% revisado'; }

// ===== PATTERNS PANEL =====
async function loadPatterns() { try { const r=await fetch('/api/correcciones/stats?unidad='+currentUnidad); const stats=await r.json(); const el=document.getElementById('patterns-panel'); if(!el) return; if(!stats.length){el.innerHTML='<div style="font-size:13px;color:var(--md-on-surface-variant)">Sin correcciones aún. Corrige tarjetas para ver patrones.</div>';return;} el.innerHTML='<h4 style="font-size:14px;color:var(--md-on-surface-variant);margin-bottom:8px;font-weight:600">Patrones de correcciones</h4>'+stats.map(s=>`<div class="pattern-card"><span class="pattern-count">${s.total}</span><div class="pattern-info"><div class="pattern-tipo">${s.tipo_error}</div><div class="pattern-palabras">${(s.palabras||[]).slice(0,5).join(', ')}${(s.palabras||[]).length>5?' ...':''}</div></div>${s.total>=3?`<button class="pattern-action" onclick="openReglaModal('${s.tipo_error}')">Crear regla</button>`:''}</div>`).join(''); } catch(e){} }

// ===== REGLAS MANAGEMENT =====
async function loadReglas() { try { const r=await fetch('/api/reglas?crew=recurvo'); const reglas=await r.json(); const el=document.getElementById('reglas-list'); const cnt=document.getElementById('reglas-count'); if(cnt) cnt.textContent=reglas.length; if(!el) return; if(!reglas.length){el.innerHTML='<div class="empty">Sin reglas. Crea reglas para que los agentes aprendan.</div>';return;} el.innerHTML=reglas.map(r=>`<div class="regla-card"><div class="regla-header"><span class="regla-tipo">${r.tipo_error}</span><span class="regla-status ${r.activa?'active':'inactive'}">${r.activa?'Activa':'Inactiva'}</span></div><div class="regla-text">${r.regla}</div>${r.ejemplos?`<div class="regla-ejemplos">${r.ejemplos}</div>`:''}<div class="regla-actions"><button class="btn btn-secondary btn-sm" onclick="editRegla(${r.id})">Editar</button><button class="btn btn-sm" style="color:var(--md-error)" onclick="deleteRegla(${r.id})">Eliminar</button></div></div>`).join(''); } catch(e){} }
function openReglaModal(tipo) { document.getElementById('r-id').value=''; document.getElementById('r-tipo').value=tipo||'otro'; document.getElementById('r-regla').value=''; document.getElementById('r-ejemplos').value=''; document.getElementById('r-activa').checked=true; document.getElementById('modal-regla-title').textContent='Nueva regla'; document.getElementById('modal-regla').classList.add('open'); }
function closeReglaModal() { document.getElementById('modal-regla').classList.remove('open'); }
async function submitRegla() { const id=document.getElementById('r-id').value; const data={crew:'recurvo',tipo_error:document.getElementById('r-tipo').value,regla:document.getElementById('r-regla').value.trim(),ejemplos:document.getElementById('r-ejemplos').value.trim(),activa:document.getElementById('r-activa').checked}; if(!data.regla){alert('Escribe la regla');return;} if(id) data.id=+id; await fetch('/api/reglas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); closeReglaModal(); loadReglas(); }
async function editRegla(id) { try { const r=await fetch('/api/reglas?crew=recurvo'); const reglas=await r.json(); const regla=reglas.find(r=>r.id===id); if(!regla) return; document.getElementById('r-id').value=regla.id; document.getElementById('r-tipo').value=regla.tipo_error; document.getElementById('r-regla').value=regla.regla; document.getElementById('r-ejemplos').value=regla.ejemplos||''; document.getElementById('r-activa').checked=regla.activa; document.getElementById('modal-regla-title').textContent='Editar regla #'+regla.id; document.getElementById('modal-regla').classList.add('open'); } catch(e){} }
async function deleteRegla(id) { if(!confirm('¿Eliminar esta regla?')) return; await fetch('/api/reglas/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); loadReglas(); }

// ===== TRAZAS =====
async function loadTrazas() {
    try {
        const r = await fetch('/api/trazas?limit=10'); const d = await r.json();
        const trazas = d.trazas || [];
        const cnt = document.getElementById('trazas-count'); if(cnt) cnt.textContent = trazas.length;
        const el = document.getElementById('trazas-list'); if (!el) return;
        if (!trazas.length) { el.innerHTML='<div class="empty">Sin trazas.</div>'; return; }
        el.innerHTML = trazas.map((t,i)=>{
            const lat=t.latency?(t.latency<1?(t.latency*1000).toFixed(0)+'ms':t.latency.toFixed(1)+'s'):'';
            const cost=t.total_cost?'$'+t.total_cost.toFixed(4):'';
            const date=t.timestamp?new Date(t.timestamp).toLocaleString('es'):'';
            return `<div><div class="trace-row" onclick="toggleTraceDetail('${t.id}',${i})"><span class="trace-name">${t.name||'trace'}</span><span class="trace-meta">${t.observations_count||0} pasos ${lat} ${date}</span><span class="trace-cost">${cost}</span></div><div id="trace-det-${i}" style="display:none"></div></div>`;
        }).join('');
    } catch(e) {}
}
async function toggleTraceDetail(traceId,idx) { const el=document.getElementById('trace-det-'+idx); if(el.style.display==='block'){el.style.display='none';return;} el.style.display='block'; el.innerHTML='<div style="color:var(--md-on-surface-variant);font-size:11px;padding:8px">Cargando...</div>'; try{const r=await fetch('/api/trazas/'+traceId);const d=await r.json();const obs=d.observations||[];if(!obs.length){el.innerHTML='<div class="trace-detail"><div class="empty">Sin detalles</div></div>';return;}el.innerHTML='<div class="trace-detail">'+obs.map(o=>{const cost=o.total_cost?'$'+o.total_cost.toFixed(4):'';const tok=o.usage?`${(o.usage.input||0)+(o.usage.output||0)} tok`:'';return `<div class="trace-step"><span class="trace-type ${o.type||''}">${o.type||'?'}</span><span class="trace-name">${o.name||''}</span><span class="trace-io">${o.input?o.input.substring(0,120):''}</span><span class="trace-cost">${tok} ${cost}</span></div>`;}).join('')+'</div>';}catch(e){el.innerHTML='<div style="color:var(--md-error);font-size:11px;padding:8px">Error</div>';}}

// ===== COMPARE =====
function toggleCompare(idx) { const pos=compareSelected.indexOf(idx); if(pos>=0)compareSelected.splice(pos,1);else if(compareSelected.length<2)compareSelected.push(idx);else{compareSelected.shift();compareSelected.push(idx);} const btn=document.getElementById('btn-compare'); if(btn) btn.disabled=compareSelected.length!==2; }
function renderComparar() {
    if (compareSelected.length!==2) return;
    const e1=evaluaciones[compareSelected[0]], e2=evaluaciones[compareSelected[1]];
    if (!e1||!e2) return;
    document.getElementById('compare-title').textContent = 'Comparar: #'+(evaluaciones.length-compareSelected[0])+' vs #'+(evaluaciones.length-compareSelected[1]);
    function col(e) {
        const m=e.metricas||{};const sc=m.score_global||0;const scores=m.scores||{};const c=sc>=80?'var(--md-success)':sc>=60?'var(--md-warning)':'var(--md-error)';
        const metrics=[['Sin plurales',scores.sin_plurales||0],['Sílabas',scores.silabas_correctas||0],['Combos',scores.combos_correctos||0],['Traducciones',scores.traducciones_completas||0],['Reglas',scores.reglas_correctas||0]];
        return `<h4>${(e.modelo||'').split('/').pop()} \u2014 <span style="color:${c};font-size:18px;font-weight:700">${sc}</span>/100</h4>
            <div style="font-size:11px;color:var(--md-on-surface-variant);margin-bottom:8px">${m.total||0} tarjetas | ${e.fecha?new Date(e.fecha).toLocaleDateString('es'):''}</div>
            ${metrics.map(([l,v])=>{const mc=v>=80?'var(--md-success)':v>=60?'var(--md-warning)':'var(--md-error)';return `<div class="metric-bar"><span class="label">${l}</span><div class="bar"><div class="fill" style="width:${v}%;background:${mc}"></div></div><span class="val">${v}%</span></div>`;}).join('')}`;
    }
    document.getElementById('compare-content').innerHTML = `<div class="compare-grid"><div class="compare-col">${col(e1)}</div><div class="compare-col">${col(e2)}</div></div>`;
}

// ===== START =====
init();
</script>
</body>
