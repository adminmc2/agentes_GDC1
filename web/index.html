<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Guía Didáctica - Sistema de Agentes</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
/* === MATERIAL DESIGN 3 — Paleta dorado-oliva / crema === */
:root {
    --md-primary: #7D7432;
    --md-primary-dark: #6E6528;
    --md-primary-light: #B5A84C;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #F5F0D0;
    --md-on-primary-container: #3A3510;
    --md-surface: #FFFDF6;
    --md-surface-variant: #F5F0DC;
    --md-on-surface: #1C1B17;
    --md-on-surface-variant: #5E5C52;
    --md-outline: #DDD9C8;
    --md-outline-variant: #EDEADF;
    --md-success: #2E7D32;
    --md-error: #C62828;
    --md-warning: #E65100;
    --md-elevation-1: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
    --md-elevation-2: 0 3px 6px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
    --md-elevation-3: 0 6px 12px rgba(0,0,0,.08), 0 3px 6px rgba(0,0,0,.06);
    --md-elevation-4: 0 10px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.06);
    --md-radius: 12px;
    --md-radius-sm: 8px;
    --md-radius-xs: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--md-surface-variant); color: var(--md-on-surface); display: grid; grid-template-columns: 256px 1fr; grid-template-rows: 56px 1fr; height: 100vh; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

/* === HEADER (top app bar) === */
header { grid-column: 1/-1; background: var(--md-primary-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 10; }
header h1 { font-size: 18px; color: var(--md-on-primary); font-weight: 600; letter-spacing: .2px; }
.live { font-size: 14px; color: rgba(255,255,255,.9); font-weight: 500; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #81C784; margin-right: 6px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* === SIDEBAR (navigation drawer) === */
.sidebar { background: var(--md-primary-dark); padding: 16px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; border-right: none; }
.sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,.55); margin-bottom: 4px; padding-left: 8px; font-weight: 600; }
.sidebar select { width: 100%; padding: 10px 12px; border-radius: var(--md-radius-sm); border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12); color: #fff; font-size: 14px; font-family: inherit; font-weight: 500; appearance: none; cursor: pointer; }
.sidebar select option { background: var(--md-primary-dark); color: #fff; }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 24px; border: none; background: none; color: rgba(255,255,255,.8); font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; text-align: left; width: 100%; transition: all .2s; }
.nav-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
.nav-btn.active { background: rgba(255,255,255,.22); color: #fff; font-weight: 600; }
.nav-btn.disabled { opacity: .35; cursor: not-allowed; }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.nav-dot.has-agents { background: #fff; }
.nav-dot.no-agents { background: rgba(255,255,255,.3); }
.nav-dot.project { background: #81C784; }
.nav-count { margin-left: auto; font-size: 12px; color: rgba(255,255,255,.6); background: rgba(0,0,0,.15); padding: 2px 8px; border-radius: 12px; font-weight: 600; }

/* === MAIN === */
main { overflow-y: auto; padding: 24px; }

/* === BREADCRUMB === */
.breadcrumb { font-size: 14px; color: var(--md-on-surface-variant); margin-bottom: 16px; }
.breadcrumb a { color: var(--md-primary); text-decoration: none; cursor: pointer; font-weight: 500; }
.breadcrumb a:hover { text-decoration: underline; }

/* === PAGE HEADER === */
.page-header { background: var(--md-surface); border-radius: var(--md-radius); box-shadow: var(--md-elevation-1); padding: 20px 24px; margin-bottom: 16px; }
.page-title { font-size: 20px; font-weight: 700; color: var(--md-on-surface); }
.page-subtitle { font-size: 14px; color: var(--md-on-surface-variant); margin-top: 4px; }

/* === SECTIONS (cards) === */
.section { background: var(--md-surface); border-radius: var(--md-radius); box-shadow: var(--md-elevation-1); margin-bottom: 16px; border: none; }
.section-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; cursor: pointer; user-select: none; }
.section-header h2 { font-size: 16px; color: var(--md-on-surface); font-weight: 600; }
.sec-badge { font-size: 12px; color: var(--md-on-surface-variant); background: var(--md-surface-variant); padding: 4px 12px; border-radius: 16px; font-weight: 500; }
.section-body { padding: 0 20px 20px; }
.section.collapsed .section-body { display: none; }
.chevron { font-size: 12px; color: var(--md-on-surface-variant); margin-left: 8px; transition: transform .2s; display: inline-block; }
.section.collapsed .chevron { transform: rotate(-90deg); }

/* === TEXT-ONLY CARD — Material "outlined" variant === */
.section.text-card { background: var(--md-surface); box-shadow: none; border: 1px solid var(--md-outline); }
.section.text-card .section-header h2 { font-weight: 500; }
.section.text-card .config-text { background: var(--md-surface); border: 1px solid var(--md-outline-variant); }

/* === EDITABLE FIELDS === */
.config-edit { width: 100%; min-height: 60px; padding: 12px 14px; font-size: 14px; color: var(--md-on-surface); line-height: 1.6; font-family: inherit; border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm); background: var(--md-surface); resize: vertical; transition: border-color .2s; }
.config-edit:focus { border-color: var(--md-primary); outline: 2px solid rgba(125,116,50,.25); }
.config-edit-sm { min-height: 36px; resize: none; }
.config-input { width: 100%; padding: 10px 12px; font-size: 14px; color: var(--md-on-surface); font-family: inherit; border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm); background: var(--md-surface); transition: border-color .2s; }
.config-input:focus { border-color: var(--md-primary); outline: 2px solid rgba(125,116,50,.25); }
.config-edit:disabled, .config-input:disabled, select.config-input:disabled { opacity: .7; cursor: default; background: var(--md-surface-container); border-color: transparent; }
.save-bar { display: flex; justify-content: flex-end; gap: 10px; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--md-outline-variant); }
.saved-toast { display: inline-block; font-size: 13px; color: var(--md-success); font-weight: 500; opacity: 0; transition: opacity .3s; }
.saved-toast.show { opacity: 1; }

/* === AGENT CARD === */
.agent-card { background: var(--md-surface); border-radius: var(--md-radius); box-shadow: var(--md-elevation-1); padding: 20px; margin-bottom: 16px; border: none; }
.agent-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.agent-name { font-size: 18px; font-weight: 700; color: var(--md-on-surface); }
.agent-version { font-size: 12px; color: var(--md-on-surface-variant); background: var(--md-surface-variant); padding: 4px 12px; border-radius: 16px; font-weight: 500; }
.agent-desc { font-size: 14px; color: var(--md-on-surface-variant); margin-bottom: 12px; line-height: 1.6; }
.agent-stats { font-size: 13px; color: var(--md-on-surface-variant); margin-bottom: 16px; }
.agent-actions { display: flex; gap: 10px; margin-bottom: 16px; }

/* === BUTTONS (Material filled + outlined) === */
.btn { padding: 10px 20px; border-radius: 20px; border: none; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .2s; letter-spacing: .2px; }
.btn-primary { background: var(--md-primary); color: var(--md-on-primary); box-shadow: var(--md-elevation-1); }
.btn-primary:hover { box-shadow: var(--md-elevation-2); filter: brightness(1.1); }
.btn-secondary { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline); }
.btn-secondary:hover { background: var(--md-primary-container); }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-success { background: var(--md-success); color: #fff; box-shadow: var(--md-elevation-1); }
.btn-success:hover { box-shadow: var(--md-elevation-2); filter: brightness(1.05); }

/* === EXECUTION LIST === */
.exec-list { border-top: 1px solid var(--md-outline); padding-top: 16px; }
.exec-list-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--md-on-surface-variant); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
.exec-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--md-radius-sm); font-size: 14px; cursor: pointer; transition: background .15s; border: none; margin-bottom: 4px; }
.exec-row:hover { background: var(--md-surface-variant); }
.exec-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.exec-dot.completed { background: var(--md-success); }
.exec-dot.error { background: var(--md-error); }
.exec-dot.running { background: var(--md-primary); animation: pulse 1s infinite; }
.exec-id { color: var(--md-on-surface-variant); min-width: 28px; font-weight: 500; }
.exec-model { color: var(--md-on-surface); flex: 1; font-weight: 500; }
.exec-score { font-weight: 700; min-width: 44px; text-align: right; }
.exec-score.good { color: var(--md-success); }
.exec-score.mid { color: var(--md-warning); }
.exec-score.bad { color: var(--md-error); }
.exec-date { color: var(--md-on-surface-variant); font-size: 13px; min-width: 100px; text-align: right; }
.exec-check { width: 16px; height: 16px; accent-color: var(--md-primary); cursor: pointer; flex-shrink: 0; }
.exec-arrow { color: var(--md-on-surface-variant); font-size: 12px; }

/* === CONFIG FIELDS === */
.config-field { margin-bottom: 14px; }
.config-label { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--md-on-surface-variant); margin-bottom: 6px; font-weight: 600; }
.config-text { background: var(--md-surface-variant); border: none; border-radius: var(--md-radius-sm); padding: 12px 14px; font-size: 14px; color: var(--md-on-surface); line-height: 1.6; white-space: pre-wrap; font-family: inherit; }
.config-row { display: flex; gap: 16px; flex-wrap: wrap; }
.config-row .config-field { flex: 1; min-width: 120px; }
.config-tag { display: inline-block; padding: 4px 12px; border-radius: 16px; font-size: 13px; background: var(--md-primary-container); color: var(--md-on-primary-container); border: none; margin: 3px; font-weight: 500; }
.metric-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
.metric-peso { min-width: 40px; text-align: right; font-weight: 700; color: var(--md-primary); }
.metric-name { min-width: 150px; color: var(--md-on-surface); font-weight: 500; }
.metric-desc { color: var(--md-on-surface-variant); }

/* === NEW EXECUTION === */
.param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.param-grid label { font-size: 13px; color: var(--md-on-surface-variant); display: block; margin-bottom: 6px; font-weight: 500; }
.param-grid select, .param-grid input { width: 100%; padding: 10px 12px; border-radius: var(--md-radius-sm); border: 1px solid var(--md-outline); background: var(--md-surface); font-size: 14px; color: var(--md-on-surface); font-family: inherit; transition: border-color .2s; }
.param-grid select:focus, .param-grid input:focus { border-color: var(--md-primary); outline: 2px solid rgba(181,168,76,.25); }
.slider-wrap { display: flex; align-items: center; gap: 10px; }
.slider-wrap input[type=range] { flex: 1; accent-color: var(--md-primary); }
.slider-val { font-size: 14px; color: var(--md-primary); font-weight: 700; min-width: 34px; }

/* === SCORE === */
.score-row { display: flex; gap: 24px; align-items: flex-start; }
.score-big { font-size: 48px; font-weight: 800; min-width: 80px; text-align: center; line-height: 1; }
.score-big.good { color: var(--md-success); }
.score-big.mid { color: var(--md-warning); }
.score-big.bad { color: var(--md-error); }
.metric-bars { flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.metric-bar { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.metric-bar .label { min-width: 120px; color: var(--md-on-surface-variant); font-weight: 500; }
.metric-bar .bar { flex: 1; height: 8px; background: var(--md-outline-variant); border-radius: 4px; overflow: hidden; }
.metric-bar .bar .fill { height: 100%; border-radius: 4px; transition: width .3s; }
.metric-bar .val { min-width: 40px; text-align: right; font-size: 13px; color: var(--md-on-surface-variant); font-weight: 600; }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.chart-box { background: var(--md-surface); border-radius: var(--md-radius); padding: 16px; box-shadow: var(--md-elevation-1); }
.chart-box h4 { font-size: 14px; color: var(--md-on-surface-variant); margin-bottom: 10px; font-weight: 600; }
.chart-box canvas { max-height: 200px; }

/* === TARJETAS TABLE === */
.tarjetas-table-wrap { overflow-x: auto; }
.tarjetas-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tarjetas-table th { position: sticky; top: 0; background: var(--md-surface-variant); padding: 10px 10px; text-align: left; font-weight: 600; color: var(--md-on-surface-variant); cursor: pointer; white-space: nowrap; border-bottom: 2px solid var(--md-outline); }
.tarjetas-table td { padding: 10px 10px; border-bottom: 1px solid var(--md-outline-variant); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tarjetas-table tr:hover { background: var(--md-surface-variant); }
.tarjetas-table td.clickable { cursor: pointer; color: var(--md-primary); font-weight: 500; }
.tarjetas-table td.clickable:hover { text-decoration: underline; }
.tarjetas-table td.err { color: var(--md-error); font-weight: 500; }
.tarjetas-search { padding: 10px 14px; border-radius: 24px; border: 1px solid var(--md-outline); background: var(--md-surface); font-size: 14px; font-family: inherit; width: 240px; transition: border-color .2s; }
.tarjetas-search:focus { border-color: var(--md-primary); outline: 2px solid rgba(181,168,76,.25); }

/* === ERRORS === */
.error-item { display: flex; gap: 10px; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--md-outline-variant); align-items: center; }
.badge { padding: 4px 10px; border-radius: 16px; font-size: 11px; color: #fff; white-space: nowrap; font-weight: 600; }
.badge-plural { background: var(--md-error); }
.badge-silaba { background: #7B1FA2; }
.badge-traduccion { background: #1565C0; }
.badge-combo { background: var(--md-warning); }
.badge-otro { background: #757575; }

/* === TRAZAS === */
.trace-row { display: flex; gap: 12px; padding: 10px 14px; margin: 4px 0; background: var(--md-surface); border-radius: var(--md-radius-sm); font-size: 14px; align-items: center; box-shadow: var(--md-elevation-1); cursor: pointer; border: none; transition: box-shadow .2s; }
.trace-row:hover { box-shadow: var(--md-elevation-2); }
.trace-name { color: var(--md-on-surface); min-width: 120px; font-weight: 600; }
.trace-meta { color: var(--md-on-surface-variant); font-size: 13px; flex: 1; }
.trace-cost { color: var(--md-primary); font-size: 13px; min-width: 60px; text-align: right; font-weight: 600; }
.trace-detail { background: var(--md-surface); box-shadow: var(--md-elevation-1); border-radius: var(--md-radius); padding: 14px; margin: 6px 0 10px; border: none; }
.trace-step { display: flex; gap: 12px; padding: 8px 12px; margin: 4px 0; background: var(--md-surface-variant); border-radius: var(--md-radius-xs); font-size: 14px; align-items: flex-start; }
.trace-type { min-width: 80px; padding: 4px 10px; border-radius: 16px; font-size: 11px; text-align: center; color: #fff; font-weight: 600; }
.trace-type.GENERATION { background: #7B1FA2; }
.trace-type.SPAN { background: #1565C0; }
.trace-io { color: var(--md-on-surface-variant); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trace-io:hover { white-space: normal; word-break: break-all; }

/* === CONSOLE === */
.console { background: #1E1E1E; border-radius: var(--md-radius); padding: 16px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; color: #A5D6A7; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.7; }

/* === COMPARE === */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare-col { background: var(--md-surface); border-radius: var(--md-radius); padding: 16px; box-shadow: var(--md-elevation-1); }
.compare-col h4 { font-size: 16px; color: var(--md-on-surface); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--md-outline); font-weight: 600; }

/* === MODAL (Material dialog) === */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: var(--md-surface); border: none; border-radius: var(--md-radius); padding: 24px; width: 460px; max-width: 90vw; box-shadow: var(--md-elevation-4); }
.modal-wide { width: 760px; }
.modal h3 { color: var(--md-on-surface); margin-bottom: 16px; font-size: 18px; font-weight: 700; }
.modal label { display: block; font-size: 13px; color: var(--md-on-surface-variant); margin-top: 12px; font-weight: 500; }
.modal input, .modal select, .modal textarea { width: 100%; padding: 10px 12px; border-radius: var(--md-radius-sm); border: 1px solid var(--md-outline); background: var(--md-surface); color: var(--md-on-surface); font-size: 14px; font-family: inherit; margin-top: 4px; }
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--md-primary); outline: 2px solid rgba(181,168,76,.25); }
.modal .btns { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
.modal .btns button { padding: 10px 20px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 600; }

/* === STATUS GRID === */
.status-grid { display: grid; grid-template-columns: 50px repeat(8, 1fr); gap: 3px; font-size: 13px; }
.status-grid .hdr { font-weight: 600; color: var(--md-on-surface-variant); text-align: center; padding: 6px; }
.status-grid .unit-label { font-weight: 600; color: var(--md-primary); padding: 6px 0; }
.status-cell { text-align: center; padding: 6px; border-radius: var(--md-radius-xs); font-size: 12px; font-weight: 500; }
.status-cell.complete { background: #E8F5E9; color: #1B5E20; }
.status-cell.partial { background: #FFF3E0; color: #E65100; }
.status-cell.missing { background: #FFEBEE; color: #B71C1C; }
.status-cell.empty { background: var(--md-surface-variant); color: #BDBDBD; }
.diagram-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.diagram-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--md-outline); background: var(--md-surface); color: var(--md-on-surface-variant); font-size: 13px; font-family: inherit; font-weight: 500; cursor: pointer; transition: all .2s; }
.diagram-tab.active { background: var(--md-primary); color: var(--md-on-primary); border-color: var(--md-primary); }
.diagram-container { background: var(--md-surface); border-radius: var(--md-radius); padding: 16px; box-shadow: var(--md-elevation-1); min-height: 200px; overflow-x: auto; }

.empty { color: var(--md-on-surface-variant); font-size: 14px; text-align: center; padding: 40px 24px; }

@media (max-width: 800px) {
    body { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .chart-row, .compare-grid, .param-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
    <h1><img src="/favicon.svg" alt="" style="height:28px;vertical-align:-4px;margin-right:8px">Guía Didáctica del Profesor</h1>
    <span class="live"><span class="live-dot"></span><span id="status-text">Conectando...</span></span>
</header>

<div class="sidebar">
    <div>
        <h3>Unidad</h3>
        <select id="sel-unidad"></select>
    </div>
    <div>
        <h3>Contenido</h3>
        <div id="nav-secciones"></div>
    </div>
    <div style="margin-top:auto">
        <button class="nav-btn" id="nav-proyecto" onclick="goTo('proyecto')">
            <span class="nav-dot project"></span>Proyecto
        </button>
    </div>
</div>

<main id="main">

    <!-- ===== PROYECTO ===== -->
    <div id="view-proyecto" style="display:none">
        <div class="page-header"><span class="page-title">Proyecto</span></div>
        <div class="section" id="sec-status">
            <div class="section-header" onclick="toggleSection('sec-status')"><h2>Estado de unidades</h2><div><span class="sec-badge" id="status-summary"></span><span class="chevron">&#9660;</span></div></div>
            <div class="section-body"><div class="status-grid" id="status-grid"></div></div>
        </div>
        <div class="section" id="sec-diagrams">
            <div class="section-header" onclick="toggleSection('sec-diagrams')"><h2>Diagramas</h2><span class="chevron">&#9660;</span></div>
            <div class="section-body"><div class="diagram-tabs" id="diagram-tabs"></div><div class="diagram-container" id="diagram-container"></div></div>
        </div>
    </div>

    <!-- ===== SECCION (agentes + ejecuciones) ===== -->
    <div id="view-seccion" style="display:none">
        <div class="page-header">
            <span class="page-title" id="seccion-title">-</span>
            <div class="page-subtitle" id="seccion-subtitle"></div>
        </div>
        <div id="seccion-content"></div>
    </div>

    <!-- ===== AGENTE (config) ===== -->
    <div id="view-agente" style="display:none">
        <div class="breadcrumb"><a onclick="goToSeccion()">&#8592; Volver</a></div>
        <div class="page-header">
            <span class="page-title" id="agente-title">-</span>
            <div class="page-subtitle" id="agente-subtitle"></div>
        </div>
        <div id="agente-content"></div>
    </div>

    <!-- ===== NUEVA EJECUCION ===== -->
    <div id="view-nueva" style="display:none">
        <div class="breadcrumb"><a onclick="goToSeccion()">&#8592; Volver</a></div>
        <div class="page-header">
            <span class="page-title" id="nueva-title">Nueva ejecución</span>
            <div class="page-subtitle" id="nueva-subtitle"></div>
        </div>
        <div id="nueva-content"></div>
    </div>

    <!-- ===== EJECUCION (detalle) ===== -->
    <div id="view-ejecucion" style="display:none">
        <div class="breadcrumb"><a onclick="goToSeccion()">&#8592; Volver</a></div>
        <div class="page-header" id="ejec-header"></div>
        <div id="ejec-sections"></div>
    </div>

    <!-- ===== COMPARAR ===== -->
    <div id="view-comparar" style="display:none">
        <div class="breadcrumb"><a onclick="goToSeccion()">&#8592; Volver</a></div>
        <div class="page-header"><span class="page-title" id="compare-title">Comparar</span></div>
        <div id="compare-content"></div>
    </div>

</main>

<!-- Modal correcciones -->
<div class="modal-bg" id="modal-corr">
    <div class="modal">
        <h3 id="modal-title">Corregir</h3>
        <input type="hidden" id="m-id"><input type="hidden" id="m-palabra"><input type="hidden" id="m-campo">
        <label>Campo</label><input id="m-campo-show" disabled>
        <label>Original</label><input id="m-original" disabled>
        <label>Corregido</label><input id="m-corregido">
        <label>Tipo error</label>
        <select id="m-tipo"><option value="silaba_tonica">Sílaba tónica</option><option value="traduccion">Traducción</option><option value="regla">Regla</option><option value="genero">Género</option><option value="plural_no_deseado">Plural</option><option value="combo">Combo</option><option value="ejemplo">Ejemplo</option><option value="otro">Otro</option></select>
        <div class="btns">
            <button onclick="closeModal()" style="background:var(--md-surface-variant);color:var(--md-on-surface)">Cancelar</button>
            <button onclick="submitFix()" style="background:var(--md-primary);color:#fff">Guardar</button>
        </div>
    </div>
</div>

<script>
// ===== DATA MODEL =====
const SECCIONES = [
    {id:'toda', name:'Toda la unidad', agentes:['recurvo']},
    {id:'vocabulario', name:'Vocabulario', agentes:[]},
    {id:'gramatica', name:'Gramática', agentes:[]},
    {id:'comunicacion', name:'Comunicación', agentes:[]},
    {id:'destrezas', name:'Destrezas', agentes:[]},
    {id:'cultura', name:'Cultura', agentes:[]},
    {id:'reflexion', name:'Reflexión', agentes:[]},
    {id:'evaluacion_sec', name:'Evaluación', agentes:[]},
];

const AGENTES = {
    recurvo: {
        name: 'Recurvo', version: '2.0', script: 'recurvo',
        desc: 'Genera tarjetas de vocabulario (pipeline de 3 agentes)',
        ambito: 'Toda la unidad',
        role: 'Vocabulary card extractor and generator',
        goal: 'Generate accurate, error-free vocabulary cards from activity inventories, incorporating prior human corrections to avoid repeating mistakes.',
        backstory: 'You have deep expertise in applied linguistics for vocabulary instruction in ELE (Spanish as a Foreign Language), specifically at A1.1 level for adolescent learners (12-15 years). You understand semantic field theory and how vocabulary organizes into thematic networks — you classify words by their primary semantic field (from the unit index) and identify secondary fields by analyzing word frequency across activities. You have working knowledge of the Spanish linguistic system relevant to A1 vocabulary: gender and number rules, stress patterns, word formation, and how words combine in frequent collocations. Cards are printed editorial material distributed to students — errors cannot be corrected after printing. You improve through a human correction feedback loop: each run incorporates lessons from previously corrected errors to prevent recurrence.',
        tasks: [
            {name:'Generador', tools:['consultar_inventario','consultar_tarjetas_previas','consultar_correcciones'], output:'JSON array de tarjetas', max_iter:10, llm_env:'RECURVO_LLM_GEN'},
            {name:'Verificador', tools:['consultar_inventario'], output:'JSON array corregido + _verificacion', max_iter:8, llm_env:'RECURVO_LLM_VER'},
            {name:'Escritor', tools:['escribir_tarjetas','exportar_csv'], output:'JSON {insertadas, csv}', max_iter:5, llm_env:'RECURVO_LLM_WR'},
        ],
        tools: [
            {name:'consultar_inventario', desc:'Lee actividades de la BD para la unidad'},
            {name:'consultar_tarjetas_previas', desc:'Lee tarjetas ya generadas para la unidad'},
            {name:'consultar_correcciones', desc:'Lee correcciones humanas previas'},
            {name:'escribir_tarjetas', desc:'Inserta tarjetas en la BD'},
            {name:'exportar_csv', desc:'Exporta tarjetas a archivo CSV'},
        ],
        eval_metrics: [
            {name:'sin_plurales', peso:25, desc:'No genera plurales innecesarios'},
            {name:'sílabas_correctas', peso:20, desc:'Sílaba tónica correcta'},
            {name:'combos_correctos', peso:20, desc:'Combinaciones léxicas válidas'},
            {name:'traducciones_completas', peso:20, desc:'7 idiomas traducidos'},
            {name:'reglas_correctas', peso:15, desc:'Regla gramatical presente'},
        ],
        params: {timeout:600, proceso:'Secuencial (3 agentes)', verbose:true, langfuse:true},
    },
};

// ===== STATE =====
let currentView = 'proyecto';
let currentSeccion = 'toda';
let currentAgente = 'recurvo';
let currentUnidad = 3;
let currentRunId = null;
let tarjetas = [], filteredTarjetas = [], correcciones = [], evaluaciones = [];
let chartRadar = null, chartHist = null, diagramData = null, currentDiagram = 'nivel1';
let sortCol = 'palabra', sortDir = 1;
let compareSelected = [];
let serverVersion = '?';

const DIAGRAM_LABELS = {nivel1:'Arquitectura',nivel2:'Flujo',nivel3:'Dependencias',nivel4:'Agentes',database:'BD'};
const SECTION_LABELS = {vocabulario:'Voc',gramatica:'Gram',comunicacion:'Com',destrezas:'Dest',cultura:'Cult',reflexion:'Ref',evaluacion:'Eval',itinerarios:'Itin'};

// ===== INIT =====
mermaid.initialize({startOnLoad:false, theme:'default', securityLevel:'loose'});

async function init() {
    try { const r = await fetch('/api/version'); const d = await r.json(); serverVersion = d.version; } catch(e) {}
    const us = document.getElementById('sel-unidad');
    us.innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<option value="${n}" ${n===currentUnidad?'selected':''}>U${String(n).padStart(2,'0')}</option>`).join('');
    us.onchange = () => { currentUnidad = +us.value; if (currentView==='seccion') renderSeccion(); };
    renderSidebar();
    goTo('proyecto');
    setInterval(pollRunStatus, 3000);
}

// ===== NAVIGATION =====
function renderSidebar() {
    document.getElementById('nav-secciones').innerHTML = SECCIONES.map(s => {
        const n = s.agentes.length;
        const cls = currentView==='seccion' && currentSeccion===s.id ? 'active' : '';
        const dis = n === 0 ? 'disabled' : '';
        return `<button class="nav-btn ${cls} ${dis}" onclick="${n?`goTo('seccion','${s.id}')`:''}" ${dis}>
            <span class="nav-dot ${n?'has-agents':'no-agents'}"></span>${s.name}
            ${n ? `<span class="nav-count">${n}</span>` : ''}
        </button>`;
    }).join('');
    document.getElementById('nav-proyecto').classList.toggle('active', currentView==='proyecto');
}

function showView(id) {
    ['proyecto','seccion','agente','nueva','ejecucion','comparar'].forEach(v =>
        document.getElementById('view-'+v).style.display = v===id ? '' : 'none');
}

function goTo(view, param) {
    currentView = view;
    if (view === 'proyecto') { showView('proyecto'); loadProjectData(); }
    else if (view === 'seccion') { currentSeccion = param || currentSeccion; showView('seccion'); renderSeccion(); }
    renderSidebar();
    updateStatus();
}

function goToSeccion() { goTo('seccion', currentSeccion); }

function goToAgente(agenteId) {
    currentAgente = agenteId;
    currentView = 'agente';
    showView('agente');
    renderAgente();
    renderSidebar();
}

function goToNueva(agenteId) {
    currentAgente = agenteId;
    currentView = 'nueva';
    showView('nueva');
    renderNueva();
    renderSidebar();
}

async function goToEjecucion(runId) {
    currentView = 'ejecucion';
    showView('ejecucion');
    await renderEjecucion(runId);
    renderSidebar();
}

function goToComparar() {
    currentView = 'comparar';
    showView('comparar');
    renderComparar();
    renderSidebar();
}

function toggleSection(id) { document.getElementById(id).classList.toggle('collapsed'); }
function updateStatus() { document.getElementById('status-text').textContent = 'v'+serverVersion+' \u2014 '+new Date().toLocaleTimeString(); }

// ===== PROYECTO =====
async function loadProjectData() {
    try {
        const r = await fetch('/api/diagrams'); diagramData = await r.json();
        renderStatusGrid(diagramData.status); renderDiagramTabs(); renderDiagram(currentDiagram);
        updateStatus();
    } catch(e) { document.getElementById('status-text').textContent = 'Error de conexión'; }
}
function renderStatusGrid(status) {
    const secs = ['vocabulario','gramatica','comunicacion','destrezas','cultura','reflexion','evaluacion','itinerarios'];
    const g = document.getElementById('status-grid');
    let comp=0, tot=0, html='<div class="hdr"></div>';
    secs.forEach(s => { html += `<div class="hdr">${SECTION_LABELS[s]}</div>`; });
    for (let i=1;i<=9;i++) {
        const u=`U${String(i).padStart(2,'0')}`;
        html += `<div class="unit-label">${u}</div>`;
        secs.forEach(s => { const info=(status[u]||{})[s]||{}; const st=info.status||'missing'; tot++; if(st==='complete')comp++; html += `<div class="status-cell ${st}">${info.lines||'-'}</div>`; });
    }
    g.innerHTML = html;
    document.getElementById('status-summary').textContent = comp+'/'+tot+' completas';
}
function renderDiagramTabs() { document.getElementById('diagram-tabs').innerHTML = Object.entries(DIAGRAM_LABELS).map(([k,v])=>`<button class="diagram-tab ${k===currentDiagram?'active':''}" onclick="selectDiagram('${k}')">${v}</button>`).join(''); }
function selectDiagram(k) { currentDiagram=k; renderDiagramTabs(); renderDiagram(k); }
async function renderDiagram(k) { if(!diagramData) return; const c=diagramData[k]; if(!c) return; const el=document.getElementById('diagram-container'); el.innerHTML=''; try { const {svg}=await mermaid.render('m-'+Date.now(),c); el.innerHTML=svg; } catch(e) { el.innerHTML=`<pre style="color:var(--md-error)">${e.message}</pre>`; } }

// ===== SECCION =====
async function renderSeccion() {
    const sec = SECCIONES.find(s=>s.id===currentSeccion);
    document.getElementById('seccion-title').textContent = sec.name + ' \u2014 U'+String(currentUnidad).padStart(2,'0');
    document.getElementById('seccion-subtitle').textContent = sec.agentes.length ? sec.agentes.length+' agente(s) disponible(s)' : '';
    const el = document.getElementById('seccion-content');
    if (!sec.agentes.length) { el.innerHTML = '<div class="empty">Sin agentes asignados a esta sección. Los agentes se crean desde el código.</div>'; return; }
    // Load evaluaciones for execution list
    try { const r = await fetch('/api/evaluaciones?unidad='+currentUnidad); evaluaciones = await r.json(); } catch(e) { evaluaciones=[]; }
    let html = '';
    for (const aid of sec.agentes) {
        const ag = AGENTES[aid]; if (!ag) continue;
        const execs = evaluaciones.filter(e => true); // all evals for this unit
        compareSelected = [];
        html += `<div class="agent-card">
            <div class="agent-card-header"><span class="agent-name">${ag.name}</span><span class="agent-version">v${ag.version}</span></div>
            <div class="agent-desc">${ag.desc}</div>
            <div class="agent-stats">${ag.tasks.length} tareas secuenciales &middot; ${ag.tools.length} tools &middot; ${ag.eval_metrics.length} métricas</div>
            <div class="agent-actions">
                <button class="btn btn-secondary btn-sm" onclick="goToAgente('${aid}')">Ver agente</button>
                <button class="btn btn-primary btn-sm" onclick="goToNueva('${aid}')">+ Nueva ejecución</button>
            </div>
            <div class="exec-list">
                <div class="exec-list-title"><span>${execs.length} ejecuciones</span>${execs.length>=2?`<button class="btn btn-secondary btn-sm" id="btn-compare" onclick="goToComparar()" disabled>Comparar</button>`:''}</div>
                ${execs.length ? execs.map((e,i) => {
                    const sc=(e.metricas||{}).score_global||0;
                    const cls=sc>=80?'good':sc>=60?'mid':'bad';
                    const model=(e.modelo||'').split('/').pop();
                    const date=e.fecha?new Date(e.fecha).toLocaleDateString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
                    return `<div class="exec-row" onclick="goToEjecucion('${e.run_id}')">
                        <input type="checkbox" class="exec-check" data-idx="${i}" onclick="event.stopPropagation();toggleCompare(${i})">
                        <span class="exec-dot completed"></span>
                        <span class="exec-id">#${execs.length-i}</span>
                        <span class="exec-model">${model}</span>
                        <span class="exec-score ${cls}">${sc}</span>
                        <span class="exec-date">${date}</span>
                        <span class="exec-arrow">&#8594;</span>
                    </div>`;
                }).join('') : '<div class="empty">Sin ejecuciones. Pulsa "+ Nueva ejecución".</div>'}
            </div>
        </div>`;
    }
    el.innerHTML = html;
}

// ===== AGENTE CONFIG (editable) =====
function saveAgentField(field, value) {
    const ag = AGENTES[currentAgente]; if (!ag) return;
    const keys = field.split('.');
    let obj = ag;
    for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
    obj[keys[keys.length-1]] = value;
}
function showSaved(id) {
    const el = document.getElementById(id);
    if (el) { el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2000); }
}
function toggleCfgEdit(section, editing) {
    document.querySelectorAll('.cfg-'+section).forEach(el => {
        el.disabled = !editing;
        el.style.opacity = editing ? '1' : '.7';
    });
    const btnEdit = document.getElementById('btn-edit-'+section);
    const btnSave = document.getElementById('btn-save-'+section);
    if (btnEdit) btnEdit.style.display = editing ? 'none' : '';
    if (btnSave) btnSave.style.display = editing ? '' : 'none';
}
function savePrompt() {
    saveAgentField('role', document.getElementById('ed-role').value);
    saveAgentField('goal', document.getElementById('ed-goal').value);
    saveAgentField('backstory', document.getElementById('ed-backstory').value);
    showSaved('saved-prompt');
}
function saveTask(i) {
    const ag = AGENTES[currentAgente];
    ag.tasks[i].name = document.getElementById('ed-task-name-'+i).value;
    ag.tasks[i].output = document.getElementById('ed-task-output-'+i).value;
    ag.tasks[i].max_iter = +document.getElementById('ed-task-iter-'+i).value;
}
function saveTasks() {
    const ag = AGENTES[currentAgente];
    ag.tasks.forEach((t,i) => saveTask(i));
    showSaved('saved-tasks');
}
function saveTool(i) {
    const ag = AGENTES[currentAgente];
    ag.tools[i].desc = document.getElementById('ed-tool-desc-'+i).value;
}
function saveAllTools() {
    const ag = AGENTES[currentAgente];
    ag.tools.forEach((t,i) => saveTool(i));
    showSaved('saved-tools');
}
function saveMetric(i) {
    const ag = AGENTES[currentAgente];
    ag.eval_metrics[i].peso = +document.getElementById('ed-metric-peso-'+i).value;
    ag.eval_metrics[i].desc = document.getElementById('ed-metric-desc-'+i).value;
}
function saveAllMetrics() {
    const ag = AGENTES[currentAgente];
    ag.eval_metrics.forEach((m,i) => saveMetric(i));
    showSaved('saved-eval');
}
function saveParams() {
    saveAgentField('params.timeout', +document.getElementById('ed-timeout').value);
    saveAgentField('params.proceso', document.getElementById('ed-proceso').value);
    saveAgentField('params.verbose', document.getElementById('ed-verbose').checked);
    saveAgentField('params.langfuse', document.getElementById('ed-langfuse').checked);
    showSaved('saved-params');
}
function renderAgente() {
    const ag = AGENTES[currentAgente]; if (!ag) return;
    document.getElementById('agente-title').textContent = ag.name + ' v' + ag.version;
    document.getElementById('agente-subtitle').textContent = ag.desc + ' \u00b7 ' + ag.ambito;
    const esc = s => (s||'').replace(/</g,'&lt;');
    document.getElementById('agente-content').innerHTML = `
        <div class="section text-card"><div class="section-header" onclick="toggleSection('sec-ag-prompt')"><h2>Prompt</h2><span class="chevron">&#9660;</span></div>
        <div class="section-body" id="sec-ag-prompt-body">
            <div class="config-field"><div class="config-label">Role</div><textarea class="config-edit config-edit-sm cfg-prompt" disabled id="ed-role">${esc(ag.role)}</textarea></div>
            <div class="config-field"><div class="config-label">Goal</div><textarea class="config-edit cfg-prompt" disabled id="ed-goal">${esc(ag.goal)}</textarea></div>
            <div class="config-field"><div class="config-label">Backstory</div><textarea class="config-edit cfg-prompt" disabled id="ed-backstory" style="min-height:120px">${esc(ag.backstory)}</textarea></div>
            <div class="save-bar">
                <span class="saved-toast" id="saved-prompt">Guardado</span>
                <button class="btn btn-secondary btn-sm" id="btn-edit-prompt" onclick="toggleCfgEdit('prompt',true)">Editar</button>
                <button class="btn btn-primary btn-sm" id="btn-save-prompt" onclick="savePrompt();toggleCfgEdit('prompt',false)" style="display:none">Guardar</button>
            </div>
        </div></div>
        <div class="section text-card"><div class="section-header" onclick="toggleSection('sec-ag-tasks')"><h2>Tareas (${ag.tasks.length})</h2><span class="chevron">&#9660;</span></div>
        <div class="section-body" id="sec-ag-tasks-body">
            ${ag.tasks.map((t,i) => `<div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--md-outline-variant)">
                <div class="config-field"><div class="config-label">Nombre tarea ${i+1}</div><input class="config-input cfg-tasks" disabled id="ed-task-name-${i}" value="${esc(t.name)}"></div>
                <div class="config-row">
                    <div class="config-field"><div class="config-label">Output</div><input class="config-input cfg-tasks" disabled id="ed-task-output-${i}" value="${esc(t.output)}"></div>
                    <div class="config-field" style="max-width:100px"><div class="config-label">Max iter</div><input type="number" class="config-input cfg-tasks" disabled id="ed-task-iter-${i}" value="${t.max_iter}"></div>
                </div>
                <div style="margin-top:6px"><div class="config-label">Tools</div>${t.tools.map(tl=>`<span class="config-tag">${tl}</span>`).join('')}</div>
            </div>`).join('')}
            <div class="save-bar">
                <span class="saved-toast" id="saved-tasks">Guardado</span>
                <button class="btn btn-secondary btn-sm" id="btn-edit-tasks" onclick="toggleCfgEdit('tasks',true)">Editar</button>
                <button class="btn btn-primary btn-sm" id="btn-save-tasks" onclick="saveTasks();toggleCfgEdit('tasks',false)" style="display:none">Guardar</button>
            </div>
        </div></div>
        <div class="section text-card"><div class="section-header" onclick="toggleSection('sec-ag-tools')"><h2>Herramientas (${ag.tools.length})</h2><span class="chevron">&#9660;</span></div>
        <div class="section-body" id="sec-ag-tools-body">
            ${ag.tools.map((t,i) => `<div class="config-row" style="margin-bottom:8px;align-items:center">
                <div style="min-width:180px"><strong>${t.name}</strong></div>
                <div style="flex:1"><input class="config-input cfg-tools" disabled id="ed-tool-desc-${i}" value="${esc(t.desc)}"></div>
            </div>`).join('')}
            <div class="save-bar">
                <span class="saved-toast" id="saved-tools">Guardado</span>
                <button class="btn btn-secondary btn-sm" id="btn-edit-tools" onclick="toggleCfgEdit('tools',true)">Editar</button>
                <button class="btn btn-primary btn-sm" id="btn-save-tools" onclick="saveAllTools();toggleCfgEdit('tools',false)" style="display:none">Guardar</button>
            </div>
        </div></div>
        <div class="section text-card"><div class="section-header" onclick="toggleSection('sec-ag-eval')"><h2>Evaluación (${ag.eval_metrics.length} métricas)</h2><span class="chevron">&#9660;</span></div>
        <div class="section-body" id="sec-ag-eval-body">
            ${ag.eval_metrics.map((m,i) => `<div class="config-row" style="margin-bottom:8px;align-items:center">
                <div style="min-width:100px"><strong>${m.name}</strong></div>
                <div style="width:70px"><input type="number" class="config-input cfg-eval" disabled id="ed-metric-peso-${i}" value="${m.peso}" min="0" max="100" style="text-align:center"></div>
                <div style="flex:1"><input class="config-input cfg-eval" disabled id="ed-metric-desc-${i}" value="${esc(m.desc)}"></div>
            </div>`).join('')}
            <div class="save-bar">
                <span class="saved-toast" id="saved-eval">Guardado</span>
                <button class="btn btn-secondary btn-sm" id="btn-edit-eval" onclick="toggleCfgEdit('eval',true)">Editar</button>
                <button class="btn btn-primary btn-sm" id="btn-save-eval" onclick="saveAllMetrics();toggleCfgEdit('eval',false)" style="display:none">Guardar</button>
            </div>
        </div></div>
        <div class="section text-card"><div class="section-header" onclick="toggleSection('sec-ag-params')"><h2>Parámetros</h2><span class="chevron">&#9660;</span></div>
        <div class="section-body" id="sec-ag-params-body">
            <div class="config-row">
                <div class="config-field"><div class="config-label">Timeout (s)</div><input type="number" class="config-input cfg-params" disabled id="ed-timeout" value="${ag.params.timeout}"></div>
                <div class="config-field"><div class="config-label">Proceso</div><select class="config-input cfg-params" disabled id="ed-proceso"><option ${ag.params.proceso==='Secuencial'?'selected':''}>Secuencial</option><option ${ag.params.proceso==='Jerárquico'?'selected':''}>Jerárquico</option></select></div>
                <div class="config-field"><div class="config-label">Verbose</div><label style="display:flex;align-items:center;gap:8px;padding-top:6px"><input type="checkbox" class="cfg-params" disabled id="ed-verbose" ${ag.params.verbose?'checked':''} style="width:18px;height:18px;accent-color:var(--md-primary)"> Activado</label></div>
                <div class="config-field"><div class="config-label">Langfuse</div><label style="display:flex;align-items:center;gap:8px;padding-top:6px"><input type="checkbox" class="cfg-params" disabled id="ed-langfuse" ${ag.params.langfuse?'checked':''} style="width:18px;height:18px;accent-color:var(--md-primary)"> Activado</label></div>
            </div>
            <div class="save-bar">
                <span class="saved-toast" id="saved-params">Guardado</span>
                <button class="btn btn-secondary btn-sm" id="btn-edit-params" onclick="toggleCfgEdit('params',true)">Editar</button>

function toggleEditCfg(editing) {
    const fields = document.querySelectorAll('.agent-cfg');
    const btnEdit = document.getElementById('btn-edit-cfg');
    const btnSave = document.getElementById('btn-save-cfg');
    fields.forEach(el => {
        el.disabled = !editing;

async function runAgent() {
    const btn = document.getElementById('btn-run');
    const agents = {};
    const ag = AGENTES[currentAgente];
    ag.tasks.forEach((t, i) => {
        agents[i] = {
            model: document.getElementById('sel-modelo-'+i)?.value || '',
            temperature: parseFloat((document.getElementById('sl-temp-'+i)?.value || 70) / 100),
            max_tokens: parseInt(document.getElementById('in-maxtok-'+i)?.value || 8192),
            top_p: parseFloat((document.getElementById('sl-topp-'+i)?.value || 100) / 100),
        };
    });
    btn.textContent = 'Ejecutando...'; btn.disabled = true; btn.className = 'btn btn-secondary';
    try {
        const res = await fetch('/api/agente/run', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({agente: currentAgente, unidad: currentUnidad, agents: agents})});
        const data = await res.json();
        if (data.error) { alert(data.error); btn.textContent='Ejecutar'; btn.disabled=false; btn.className='btn btn-success'; return; }
        currentRunId = data.run_id;
        goToEjecucion(data.run_id);
    } catch(e) { alert('Error: '+e.message); btn.textContent='Ejecutar'; btn.disabled=false; btn.className='btn btn-success'; }
}

// ===== EJECUCION DETALLE =====
async function renderEjecucion(runId) {
    const ag = AGENTES[currentAgente];
    // Load all data
    let output = '', status = 'completed', elapsed = 0, modelo = '';
    try { const r = await fetch('/api/agente/output?run_id='+runId); const d = await r.json(); output = d.output || ''; } catch(e) {}
    try { const r = await fetch('/api/agente/status?run_id='+runId); const d = await r.json(); status=d.status||'completed'; elapsed=d.elapsed_s||0; modelo=d.modelo||''; } catch(e) {}
    try { const r = await fetch('/api/tarjetas?unidad='+currentUnidad); tarjetas = await r.json(); filteredTarjetas=[...tarjetas]; } catch(e) { tarjetas=[]; filteredTarjetas=[]; }
    try { const r = await fetch('/api/correcciones?unidad='+currentUnidad); correcciones = await r.json(); } catch(e) { correcciones=[]; }
    try { const r = await fetch('/api/evaluaciones?unidad='+currentUnidad); evaluaciones = await r.json(); } catch(e) { evaluaciones=[]; }
    const evalMatch = evaluaciones.find(e => e.run_id === runId) || evaluaciones[0];
    const sc = evalMatch ? (evalMatch.metricas||{}).score_global || 0 : 0;
    const modelShort = (modelo || (evalMatch||{}).modelo || '').split('/').pop();
    const badgeCls = status==='running'?'running':status==='completed'?(sc>=80?'good':'mid'):'bad';

    document.getElementById('ejec-header').innerHTML = `
        <span class="page-title">${ag.name} \u2014 U${String(currentUnidad).padStart(2,'0')}</span>
        <div class="page-subtitle">${modelShort} &middot; ${elapsed?elapsed+'s':''} &middot; <span style="color:var(--${badgeCls==='good'?'md-success':badgeCls==='mid'?'md-warning':'md-error'})">${status==='running'?'Ejecutando...':sc+'/100'}</span></div>`;

    let html = '';
    // Console
    html += `<div class="section" id="sec-consola"><div class="section-header" onclick="toggleSection('sec-consola')"><h2>Consola</h2><div><span class="sec-badge" id="console-status">${status==='running'?'Ejecutando...':status}</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body"><div class="console" id="console-output">${output||'Sin salida disponible.'}</div></div></div>`;
    // Evaluation
    html += `<div class="section" id="sec-evaluacion"><div class="section-header" onclick="toggleSection('sec-evaluacion')"><h2>Evaluación</h2><div><span class="sec-badge" id="eval-badge">${sc?sc+'/100':'--'}</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body"><div id="eval-content"></div></div></div>`;
    // Tarjetas
    html += `<div class="section collapsed" id="sec-tarjetas"><div class="section-header" onclick="toggleSection('sec-tarjetas')"><h2>Tarjetas</h2><div><span class="sec-badge">${tarjetas.length}</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:12px;color:var(--md-on-surface-variant)" id="tarjetas-info">${tarjetas.length} tarjetas</span><input type="text" class="tarjetas-search" placeholder="Buscar..." id="tarjetas-search" oninput="filterTarjetas()"></div>
        <div class="tarjetas-table-wrap"><table class="tarjetas-table"><thead><tr>
            <th onclick="sortTarjetas('palabra')">Palabra</th><th onclick="sortTarjetas('nivel_jerarquia')">Nivel</th><th onclick="sortTarjetas('genero')">Gen</th><th>Sílaba</th><th onclick="sortTarjetas('campo_semantico')">Campo</th><th>Regla</th><th>IT</th><th>FR</th><th>PT</th><th>EN</th><th>CS</th><th>PL</th><th>TR</th><th>Combos</th><th>Acc</th>
        </tr></thead><tbody id="tarjetas-tbody"></tbody></table></div></div></div>`;
    // Trazas
    html += `<div class="section collapsed" id="sec-trazas"><div class="section-header" onclick="toggleSection('sec-trazas')"><h2>Trazas LLM</h2><div><span class="sec-badge" id="trazas-count">0</span><span class="chevron">&#9660;</span></div></div>
        <div class="section-body"><div id="trazas-list"></div></div></div>`;

    document.getElementById('ejec-sections').innerHTML = html;
    renderTarjetas();

    loadTrazas();
    if (status === 'running') currentRunId = runId;
}

function renderEvalContent(ev) {
    const m = ev.metricas || {};
    const sc = m.score_global || 0;
    const scores = m.scores || {};
    const metrics = [['Sin plurales',scores.sin_plurales||0],['Sílabas',scores.silabas_correctas||0],['Combos',scores.combos_correctos||0],['Traducciones',scores.traducciones_completas||0],['Reglas',scores.reglas_correctas||0]];
    const el = document.getElementById('eval-content');
    el.innerHTML = `
        <div class="score-row">
            <div class="score-big ${sc>=80?'good':sc>=60?'mid':'bad'}">${sc}</div>
            <div class="metric-bars">${metrics.map(([l,v])=>{const c=v>=80?'var(--md-success)':v>=60?'var(--md-warning)':'var(--md-error)';return `<div class="metric-bar"><span class="label">${l}</span><div class="bar"><div class="fill" style="width:${v}%;background:${c}"></div></div><span class="val">${v}%</span></div>`;}).join('')}</div>
        </div>
        <div class="chart-row"><div class="chart-box"><h4>Métricas</h4><canvas id="chart-radar"></canvas></div><div class="chart-box"><h4>Historial</h4><canvas id="chart-history"></canvas></div></div>
        <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
            <button class="btn btn-secondary btn-sm" onclick="runEval()" id="btn-eval">Evaluar ahora</button>
            <span style="font-size:12px;color:var(--md-on-surface-variant)">${m.total||0} tarjetas | ${(ev.modelo||'').split('/').pop()}</span>
        </div>
        <div style="margin-top:12px"><h3 style="font-size:12px;color:var(--md-primary);margin-bottom:6px">Errores (${(m.errores||[]).length})</h3>
        ${(m.errores||[]).length ? (m.errores||[]).map(e=>`<div class="error-item"><span class="badge badge-${e.tipo==='plural'?'plural':e.tipo==='silaba'?'silaba':e.tipo==='traduccion'?'traduccion':e.tipo==='combo'?'combo':'otro'}">${e.tipo}</span><span style="color:var(--md-primary);min-width:80px">${e.palabra}</span><span style="color:var(--md-on-surface-variant)">${e.detalle}</span></div>`).join('') : '<div style="color:var(--md-success);font-size:12px">Sin errores</div>'}</div>`;
    // Charts
    if (chartRadar) chartRadar.destroy();
    chartRadar = new Chart(document.getElementById('chart-radar'), {type:'radar', data:{labels:metrics.map(m=>m[0]),datasets:[{label:(ev.modelo||'').split('/').pop(),data:metrics.map(m=>m[1]),backgroundColor:'rgba(181,168,76,.18)',borderColor:'var(--md-primary)',pointBackgroundColor:'var(--md-primary)'}]},options:{scales:{r:{min:0,max:100,ticks:{stepSize:20,color:'#999'},grid:{color:'#ddd'},pointLabels:{color:'#666',font:{size:10}}}},plugins:{legend:{labels:{color:'#666'}}}}});
    if (chartHist) chartHist.destroy();
    const rev=[...evaluaciones].reverse();
    chartHist = new Chart(document.getElementById('chart-history'), {type:'line', data:{labels:rev.map(e=>{const d=new Date(e.fecha);return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit'});}),datasets:[{label:'Score',data:rev.map(e=>(e.metricas||{}).score_global||0),borderColor:'var(--md-success)',backgroundColor:'rgba(92,184,122,.1)',fill:true,tension:.3}]},options:{scales:{y:{min:0,max:100,ticks:{color:'#999'},grid:{color:'#eee'}},x:{ticks:{color:'#999'},grid:{color:'#eee'}}},plugins:{legend:{labels:{color:'#666'}}}}});
}

async function runEval() {
    const btn = document.getElementById('btn-eval'); btn.textContent='Evaluando...'; btn.disabled=true;
    await fetch('/api/evaluaciones/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidad:currentUnidad})});
    const r = await fetch('/api/evaluaciones?unidad='+currentUnidad); evaluaciones = await r.json();
    if (evaluaciones.length) renderEvalContent(evaluaciones[0]);
    btn.textContent='Evaluar ahora'; btn.disabled=false;
}

// ===== POLL =====
async function pollRunStatus() {
    if (!currentRunId) return;
    try {
        const r = await fetch('/api/agente/status?run_id='+currentRunId); const d = await r.json();
        const or = await fetch('/api/agente/output?run_id='+currentRunId); const od = await or.json();
        const consoleEl = document.getElementById('console-output');
        const statusEl = document.getElementById('console-status');
        if (consoleEl && od.output) { consoleEl.textContent = od.output; consoleEl.scrollTop = consoleEl.scrollHeight; }
        if (d.status === 'running') {
            if (statusEl) statusEl.textContent = 'Ejecutando... '+d.elapsed_s+'s';
        } else {
            if (statusEl) statusEl.textContent = d.status+' ('+d.elapsed_s+'s)';
            if (d.status === 'completed' && consoleEl) {
                consoleEl.textContent += '\n--- Evaluando automáticamente... ---\n';
                await fetch('/api/evaluaciones/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidad:currentUnidad})});
            }
            currentRunId = null;
            if (currentView === 'ejecucion') {
                const r2 = await fetch('/api/evaluaciones?unidad='+currentUnidad); evaluaciones = await r2.json();
                const r3 = await fetch('/api/tarjetas?unidad='+currentUnidad); tarjetas = await r3.json(); filteredTarjetas=[...tarjetas];
                if (evaluaciones.length) renderEvalContent(evaluaciones[0]);
                renderTarjetas();
                const ti = document.getElementById('sec-tarjetas');
                if (ti) { ti.querySelector('.sec-badge').textContent = tarjetas.length; }
            }
        }
    } catch(e) {}
}

function sortTarjetas(col) { if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;} filteredTarjetas.sort((a,b)=>{const va=a[col]!=null?a[col]:'';const vb=b[col]!=null?b[col]:'';if(typeof va==='number'&&typeof vb==='number')return sortDir*(va-vb);return sortDir*String(va).localeCompare(String(vb),'es');}); renderTarjetas(); }
function filterTarjetas() { const q=document.getElementById('tarjetas-search').value.toLowerCase(); filteredTarjetas=q?tarjetas.filter(t=>(t.palabra||'').toLowerCase().includes(q)):[...tarjetas]; const info=document.getElementById('tarjetas-info'); if(info) info.textContent=filteredTarjetas.length+(q?' de '+tarjetas.length:'')+' tarjetas'; renderTarjetas(); }

        <td class="clickable${hasCorr('genero')?' err':''}" ${cc('genero',t.genero)}>${t.genero||''}</td>
        <td class="clickable${hasCorr('silaba_tonica')?' err':''}" ${cc('silaba_tonica',t.silaba_tonica)}>${t.silaba_tonica||''}</td>

        <td class="clickable${hasCorr('trad_it')?' err':''}" ${cc('trad_it',t.trad_it)}>${t.trad_it||''}</td>
        <td class="clickable${hasCorr('trad_fr')?' err':''}" ${cc('trad_fr',t.trad_fr)}>${t.trad_fr||''}</td>
        <td class="clickable${hasCorr('trad_pt_br')?' err':''}" ${cc('trad_pt_br',t.trad_pt_br)}>${t.trad_pt_br||''}</td>
        <td class="clickable${hasCorr('trad_en')?' err':''}" ${cc('trad_en',t.trad_en)}>${t.trad_en||''}</td>
        <td class="clickable${hasCorr('trad_cs')?' err':''}" ${cc('trad_cs',t.trad_cs)}>${t.trad_cs||''}</td>

function openModal(id,palabra,campo,original) { document.getElementById('m-id').value=id; document.getElementById('m-palabra').value=palabra; document.getElementById('m-campo').value=campo; document.getElementById('m-campo-show').value=campo||'(selecciona)'; document.getElementById('m-original').value=original; document.getElementById('m-corregido').value=''; document.getElementById('modal-title').textContent='Corregir: '+palabra+(campo?' > '+campo:''); document.getElementById('modal-corr').classList.add('open'); }
function closeModal() { document.getElementById('modal-corr').classList.remove('open'); }
async function submitFix() { const id=document.getElementById('m-id').value,palabra=document.getElementById('m-palabra').value,campo=document.getElementById('m-campo').value,original=document.getElementById('m-original').value,corregido=document.getElementById('m-corregido').value,tipo=document.getElementById('m-tipo').value; if(!corregido&&tipo!=='plural_no_deseado'){alert('Escribe el valor corregido');return;} await fetch('/api/correcciones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidad:currentUnidad,palabra,campo,valor_original:original,valor_corregido:corregido,tipo_error:tipo})}); if(corregido&&campo){await fetch('/api/tarjetas/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:+id,campo,valor:corregido})});} closeModal(); try{const r=await fetch('/api/tarjetas?unidad='+currentUnidad);tarjetas=await r.json();filteredTarjetas=[...tarjetas];renderTarjetas();}catch(e){} }
async function delCard(id,palabra) { if(!confirm('Eliminar "'+palabra+'"?'))return; await fetch('/api/correcciones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidad:currentUnidad,palabra,campo:'palabra',valor_original:palabra,valor_corregido:null,tipo_error:'eliminada'})}); await fetch('/api/tarjetas/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); try{const r=await fetch('/api/tarjetas?unidad='+currentUnidad);tarjetas=await r.json();filteredTarjetas=[...tarjetas];renderTarjetas();}catch(e){} }

async function loadTrazas() {
    try {
        const r = await fetch('/api/trazas?limit=10'); const d = await r.json();
        const trazas = d.trazas || [];
        const cnt = document.getElementById('trazas-count'); if(cnt) cnt.textContent = trazas.length;
        const el = document.getElementById('trazas-list'); if (!el) return;
        if (!trazas.length) { el.innerHTML='<div class="empty">Sin trazas.</div>'; return; }
        el.innerHTML = trazas.map((t,i)=>{
            const lat=t.latency?(t.latency<1?(t.latency*1000).toFixed(0)+'ms':t.latency.toFixed(1)+'s'):'';
            const cost=t.total_cost?'$'+t.total_cost.toFixed(4):'';
            const date=t.timestamp?new Date(t.timestamp).toLocaleString('es'):'';
            return `<div><div class="trace-row" onclick="toggleTraceDetail('${t.id}',${i})"><span class="trace-name">${t.name||'trace'}</span><span class="trace-meta">${t.observations_count||0} pasos ${lat} ${date}</span><span class="trace-cost">${cost}</span></div><div id="trace-det-${i}" style="display:none"></div></div>`;
        }).join('');
    } catch(e) {}
}
async function toggleTraceDetail(traceId,idx) { const el=document.getElementById('trace-det-'+idx); if(el.style.display==='block'){el.style.display='none';return;} el.style.display='block'; el.innerHTML='<div style="color:var(--md-on-surface-variant);font-size:11px;padding:8px">Cargando...</div>'; try{const r=await fetch('/api/trazas/'+traceId);const d=await r.json();const obs=d.observations||[];if(!obs.length){el.innerHTML='<div class="trace-detail"><div class="empty">Sin detalles</div></div>';return;}el.innerHTML='<div class="trace-detail">'+obs.map(o=>{const cost=o.total_cost?'$'+o.total_cost.toFixed(4):'';const tok=o.usage?`${(o.usage.input||0)+(o.usage.output||0)} tok`:'';return `<div class="trace-step"><span class="trace-type ${o.type||''}">${o.type||'?'}</span><span class="trace-name">${o.name||''}</span><span class="trace-io">${o.input?o.input.substring(0,120):''}</span><span class="trace-cost">${tok} ${cost}</span></div>`;}).join('')+'</div>';}catch(e){el.innerHTML='<div style="color:var(--md-error);font-size:11px;padding:8px">Error</div>';}}

// ===== COMPARE =====
function toggleCompare(idx) { const pos=compareSelected.indexOf(idx); if(pos>=0)compareSelected.splice(pos,1);else if(compareSelected.length<2)compareSelected.push(idx);else{compareSelected.shift();compareSelected.push(idx);} const btn=document.getElementById('btn-compare'); if(btn) btn.disabled=compareSelected.length!==2; }
function renderComparar() {
    if (compareSelected.length!==2) return;
    const e1=evaluaciones[compareSelected[0]], e2=evaluaciones[compareSelected[1]];
    if (!e1||!e2) return;
    document.getElementById('compare-title').textContent = 'Comparar: #'+(evaluaciones.length-compareSelected[0])+' vs #'+(evaluaciones.length-compareSelected[1]);
    function col(e) {
        const m=e.metricas||{};const sc=m.score_global||0;const scores=m.scores||{};const c=sc>=80?'var(--md-success)':sc>=60?'var(--md-warning)':'var(--md-error)';
        const metrics=[['Sin plurales',scores.sin_plurales||0],['Sílabas',scores.silabas_correctas||0],['Combos',scores.combos_correctos||0],['Traducciones',scores.traducciones_completas||0],['Reglas',scores.reglas_correctas||0]];
        return `<h4>${(e.modelo||'').split('/').pop()} \u2014 <span style="color:${c};font-size:18px;font-weight:700">${sc}</span>/100</h4>
            <div style="font-size:11px;color:var(--md-on-surface-variant);margin-bottom:8px">${m.total||0} tarjetas | ${e.fecha?new Date(e.fecha).toLocaleDateString('es'):''}</div>
            ${metrics.map(([l,v])=>{const mc=v>=80?'var(--md-success)':v>=60?'var(--md-warning)':'var(--md-error)';return `<div class="metric-bar"><span class="label">${l}</span><div class="bar"><div class="fill" style="width:${v}%;background:${mc}"></div></div><span class="val">${v}%</span></div>`;}).join('')}`;
    }
    document.getElementById('compare-content').innerHTML = `<div class="compare-grid"><div class="compare-col">${col(e1)}</div><div class="compare-col">${col(e2)}</div></div>`;
}

// ===== START =====
init();
</script>
