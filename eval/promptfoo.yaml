# promptfoo config — Comparación de LLMs para agente Recurvo
#
# Uso:
#   cd eval && promptfoo eval
#   promptfoo view  (abre UI web en localhost:15500)
#
# Compara diferentes modelos ejecutando el mismo agente CrewAI
# con el mismo prompt y midiendo la calidad del output.

description: "Recurvo — Comparación de modelos para tarjetas de vocabulario U03"

prompts:
  - id: backstory-v1
    raw: |
      Eres un especialista en lexicología aplicada a ELE A1.1.
      Conoces los campos semánticos del nivel, las 7 L1 del aula
      (italiano, francés, portugués brasileño, inglés, checo, polaco, turco),
      las reglas morfológicas del español (género, número, acentuación)
      y el inventario léxico de las unidades previas del curso.
      IMPORTANTE: Las tarjetas son material impreso que llega al alumno.
      Tolerancia a errores = CERO.
      REGLAS CRÍTICAS:
      - Solo formas genéricas: singular masculino/femenino, NUNCA plurales.
      - Sílaba tónica: sin guiones, tónica en MAYÚSCULAS (aBUElo, no a-BUE-lo).
      - Combos: exactamente 3, variados (no solo posesivos).
      - Traducciones: las 9 lenguas obligatorias (EN, FR, PT, AL, PL, NL, GR, TR, CZ).

providers:
  - id: "script:python3 provider_crewai.py"
    label: "GPT-OSS-120B (Groq)"
    config:
      model: "groq/openai/gpt-oss-120b"
      unidad: 3

  - id: "script:python3 provider_crewai.py"
    label: "Kimi K2 (Groq)"
    config:
      model: "groq/moonshotai/kimi-k2-instruct"
      unidad: 3

# Para habilitar Claude Sonnet (coste ~$0.13/ejecución), descomenta:
#  - id: "script:python3 provider_crewai.py"
#    label: "Claude Sonnet 4"
#    config:
#      model: "anthropic/claude-sonnet-4-20250514"
#      unidad: 3

tests:
  - description: "Genera tarjetas U03 vocabulario"
    vars: {}
    assert:
      # Debe generar al menos 10 tarjetas
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.total_tarjetas >= 10;
        metric: tarjetas_suficientes

      # No debe haber plurales
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.plurales_detectados === 0;
        metric: sin_plurales

      # Debe tener tarjetas de nivel 1 (obligatorias)
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.nivel_1 >= 5;
        metric: nivel_1_minimo

      # No debe haber traducciones vacías
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.traducciones_vacias === 0;
        metric: traducciones_completas

      # No debe haber combos repetitivos
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.combos_repetitivos === 0;
        metric: combos_variados

outputPath: resultados/
